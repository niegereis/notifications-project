# Balanceador da API para o teste de carga com réplicas (docker-compose.scale.yml).
#
# `server api:3000` é resolvido na subida do nginx para TODOS os IPs das réplicas
# (o DNS do Compose devolve um registro por container), e o nginx distribui entre
# eles em round-robin. Por isso o `lb` só sobe depois de todas as réplicas da API
# estarem saudáveis; se escalar a API depois, reinicie o `lb`.
worker_processes auto;

events {
  worker_connections 16384;
}

http {
  access_log off;

  upstream api {
    server api:3000;
    keepalive 512;
    # O Node fecha conexões ociosas após 5 s (keepAliveTimeout). Se o nginx
    # reaproveitar uma conexão no instante em que o Node a fecha, o pedido volta
    # como 502 ("Connection reset by peer"): 7 casos na rodada 6. Fechar do lado
    # do nginx primeiro (menos que 5 s) elimina a corrida.
    keepalive_timeout 4s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
