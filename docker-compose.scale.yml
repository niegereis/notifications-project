# Override para escalar a API atrás de um balanceador (rodada 6 do teste de carga).
#
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.scale.yml
#   API_REPLICAS=4 docker compose up -d --build --wait api worker lb
#
# O que muda em relação ao compose base:
#   - `api` deixa de publicar a porta no host (várias réplicas não podem dividir
#     a mesma porta) e sobe com API_REPLICAS réplicas (padrão 4);
#   - `lb` (nginx) assume a porta do host (API_PORT, padrão 3000) e distribui
#     entre as réplicas;
#   - o k6 passa a mirar o `lb`.
#
# Cada réplica abre até 10 conexões com o Postgres (padrão do pg), então com 4
# réplicas + worker são ~50 de 100 (max_connections). Acima de ~8 réplicas
# aumente o max_connections do Postgres.
#
# O Prometheus raspa `api:3000`, que resolve para UMA réplica por vez: durante o
# teste com réplicas, os gráficos da API mostram só uma fatia. Use o k6 e o
# `docker stats` como fonte de verdade.
services:
  api:
    ports: !reset []
    deploy:
      replicas: ${API_REPLICAS:-4}

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:80'
    volumes:
      - ./docker/nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 3s
      retries: 10

  k6:
    environment:
      BASE_URL: http://lb
    depends_on:
      lb:
        condition: service_healthy
